{% extends "base.html" %}
{% block content %}
<section class="page-heading page-heading-row"><div><p class="eyebrow">THE PEOPLE</p><h1>Employee directory</h1><p class="muted">Find a colleague by name, email, or department.</p></div><div class="search-box"><span aria-hidden="true">⌕</span><input id="employee-search" type="search" placeholder="Search employees" aria-label="Search employees"></div></section>
<div class="notice" id="employees-notice" hidden></div>
<section id="employee-list" class="employee-grid"><div class="card loading-card"><span class="spinner"></span>Loading employees…</div></section>
<p class="muted result-count" id="employee-result-count"></p>
{% endblock %}
{% block scripts %}<script defer src="{{ url_for('static', path='/js/dashboard.js') }}"></script>{% endblock %}
